<!-- @dsCard group="Forms" height=280 subtitle=".field · label[for] · .input · .hint · .err · aria-invalid" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Preview</title></head>
<body>
<form class="pv pv-stack" style="max-width:420px" novalidate>
  <div class="field"><label for="p-name">Your name</label><input id="p-name" class="input" name="name" autocomplete="name"><p class="hint">As it should appear on your quote.</p></div>
  <div class="field"><label for="p-email">Email</label><input id="p-email" class="input" type="email" name="email" value="ama@" aria-invalid="true" aria-describedby="p-email-error"><p class="err" id="p-email-error"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 8v5m0 3.5v.5M12 3l9.5 17h-19L12 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Enter an email like name@example.com</p></div>
</form>
</body>
</html>
