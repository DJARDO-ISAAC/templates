<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Looq</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 100%; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; right: 0; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .brand { fill: var(--brand); }
  .accent { fill: var(--accent); }
  .deep { fill: var(--ink); }
  .tint { fill: var(--line-strong); }
  .lite { fill: var(--canvas); }
  .r-lg { rx: var(--radius-lg); }
  .r-sm { rx: var(--radius-sm); }
  .r-md { rx: var(--radius-md); }
  .r-pill { rx: 48px; }
  .r-disc { rx: 20px; }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 120px; line-height: .9; font-weight: 800; letter-spacing: -.03em; color: var(--ink); }
  .tagline { margin: var(--space-3) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      brand 144×248 slab bled off the top (the action colour, largest) · accent 128×96 pill (the highlight) · ink 192×208 bled off the right edge (text/night) · line-strong 64×64 square once (the hairline system) — ≈40% of 960×288
        arrangement one tall brand slab with satellites, bottoms on one line space-8 above the edge, space-4 gutters
        pattern     tiles cut by the radius tokens, from "names are shared, values belong to each template": two rows of 40px tiles going radius-sm → radius-md → full disc, cut into the ink block in canvas and line-strong (both read on ink in light and dark)
        scales      sides in space-4 multiples; gutters space-4; tile pitch 56 (40 + space-4); corners radius-lg on slabs, radius-sm/md and half-side discs on tiles, pill rx = half of 96
      -->
      <rect class="brand r-lg" x="16" y="-24" width="144" height="272" rx="24"/>
      <rect class="tint r-md" x="176" y="32" width="64" height="64" rx="12"/>
      <rect class="accent r-pill" x="176" y="152" width="128" height="96" rx="48"/>
      <rect class="deep r-lg" x="320" y="40" width="192" height="208" rx="24"/>
      <rect class="lite r-sm" x="328" y="88" width="40" height="40" rx="6"/>
      <rect class="lite r-md" x="384" y="88" width="40" height="40" rx="12"/>
      <rect class="lite r-disc" x="440" y="88" width="40" height="40" rx="20"/>
      <rect class="tint r-sm" x="328" y="144" width="40" height="40" rx="6"/>
      <rect class="tint r-md" x="384" y="144" width="40" height="40" rx="12"/>
      <rect class="tint r-disc" x="440" y="144" width="40" height="40" rx="20"/>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">Looq</h1>
    <p class="tagline">One system, many sites. Shared names, each template's own look.</p>
  </div>
</div>
</body>
</html>
