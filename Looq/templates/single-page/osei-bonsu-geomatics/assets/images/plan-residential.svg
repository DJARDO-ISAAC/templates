<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t1">
  <title id="t1">Cadastral subdivision plan of 24 residential plots along a new access road</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1b3a2c" stroke-width=".5" opacity=".13"/>
    </pattern>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v6" stroke="#b08d57" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f4eddf"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- outer boundary -->
  <path d="M86 92h628v416H86z" fill="none" stroke="#1b3a2c" stroke-width="2.2"/>
  <path d="M86 92h628v416H86z" fill="url(#hatch)" opacity=".18"/>

  <!-- access road -->
  <path d="M86 330c96-38 206-44 314-30s224 12 314-16" fill="none" stroke="#efe7d6" stroke-width="46"/>
  <path d="M86 330c96-38 206-44 314-30s224 12 314-16" fill="none" stroke="#1b3a2c" stroke-width="1.1" stroke-dasharray="12 9" opacity=".7"/>
  <path d="M86 307c96-38 206-44 314-30s224 12 314-16M86 353c96-38 206-44 314-30s224 12 314-16" fill="none" stroke="#1b3a2c" stroke-width="1.4" opacity=".55"/>

  <!-- top row of plots -->
  <g fill="none" stroke="#1b3a2c" stroke-width="1.2">
    <path d="M118 120v180M202 120v184M286 120v188M370 120v191M454 120v193M538 120v193M622 120v191"/>
    <path d="M118 120h588M118 196h588"/>
  </g>
  <!-- bottom row of plots -->
  <g fill="none" stroke="#1b3a2c" stroke-width="1.2">
    <path d="M118 374v102M202 372v104M286 370v106M370 368v108M454 366v110M538 364v112M622 362v114"/>
    <path d="M118 476h588M118 410h588"/>
  </g>

  <!-- plot numbers -->
  <g fill="#1b3a2c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">
    <text x="126" y="163">01</text><text x="210" y="163">02</text><text x="294" y="163">03</text><text x="378" y="163">04</text><text x="462" y="163">05</text><text x="546" y="163">06</text><text x="630" y="163">07</text>
    <text x="126" y="230">08</text><text x="210" y="230">09</text><text x="294" y="230">10</text><text x="378" y="230">11</text><text x="462" y="230">12</text><text x="546" y="230">13</text><text x="630" y="230">14</text>
    <text x="126" y="410">15</text><text x="210" y="408">16</text><text x="294" y="406">17</text><text x="378" y="404">18</text><text x="462" y="402">19</text><text x="546" y="400">20</text><text x="630" y="398">21</text>
    <text x="126" y="458">22</text><text x="210" y="456">23</text><text x="294" y="454">24</text>
  </g>

  <!-- highlighted plot 11 -->
  <path d="M370 196h84v104h-84z" fill="#b08d57" opacity=".22"/>
  <path d="M370 196h84v104h-84z" fill="none" stroke="#b08d57" stroke-width="2.4"/>
  <circle cx="412" cy="248" r="4" fill="#b08d57"/>

  <!-- survey pegs -->
  <g fill="#f4eddf" stroke="#b4542a" stroke-width="1.6">
    <circle cx="118" cy="120" r="4"/><circle cx="370" cy="120" r="4"/><circle cx="706" cy="120" r="4"/>
    <circle cx="118" cy="476" r="4"/><circle cx="706" cy="476" r="4"/><circle cx="412" cy="300" r="4"/>
  </g>

  <!-- north arrow -->
  <g transform="translate(730 60)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#1b3a2c" stroke-width="1"/>
    <path d="M0-17 7 8 0 3-7 8Z" fill="#1b3a2c"/>
    <text x="0" y="-30" text-anchor="middle" fill="#1b3a2c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">N</text>
  </g>

  <!-- scale bar -->
  <g transform="translate(118 545)" fill="#1b3a2c" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect width="80" height="7" fill="#1b3a2c"/><rect x="80" width="80" height="7" fill="#f4eddf" stroke="#1b3a2c" stroke-width="1"/>
    <text x="0" y="24" font-size="10">0</text><text x="70" y="24" font-size="10">50 m</text>
  </g>

  <!-- title block -->
  <g transform="translate(500 505)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect width="214" height="76" fill="#f4eddf" stroke="#1b3a2c" stroke-width="1.2"/>
    <text x="14" y="23" fill="#1b3a2c" font-size="11" font-weight="700" letter-spacing="1.4">CADASTRAL PLAN</text>
    <text x="14" y="40" fill="#1b3a2c" font-size="10">Ablekuma North · Plot 11</text>
    <text x="14" y="55" fill="#6c7a6f" font-size="9">Scale 1:1 000 · GCS 121</text>
    <text x="14" y="68" fill="#6c7a6f" font-size="9">Osei-Bonsu Geomatics · 2025</text>
  </g>
</svg>
