          <div class="tpl-lightbox-nav">
            <button type="button" class="tpl-round-btn" data-lightbox-prev aria-label="Previous photo"><svg class="tpl-flip" aria-hidden="true"><use href="#i-arrow"/></svg></button>

            <button type="button" class="tpl-round-btn" data-lightbox-next aria-label="Next photo"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
