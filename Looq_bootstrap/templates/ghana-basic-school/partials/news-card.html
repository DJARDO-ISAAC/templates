<a class="tpl-news-card {{ delay }}" href="{{ href }}" data-reveal data-category="{{ category }}">
  <div class="tpl-news-card-img"><img src="https://images.pexels.com/photos/{{ img }}/pexels-photo-{{ img }}.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=800" alt="{{ alt }}" width="800" height="560" loading="lazy"></div>
  <div class="tpl-news-card-body">
    <span class="tpl-news-meta"><span class="tpl-tag">{{ tag }}</span> <time datetime="{{ datetime }}">{{ date }}</time></span>
    <h3>{{ title }}</h3>
    <p class="tpl-text-mute mb-0">{{ excerpt }}</p>
  </div>
  <span class="tpl-news-card-more">Read story <svg aria-hidden="true"><use href="#i-arrow-up-right"/></svg></span>
</a>
