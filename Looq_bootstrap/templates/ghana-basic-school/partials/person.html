<article class="tpl-person {{ delay }}" data-reveal>
  <div class="tpl-person-img">
    <img src="https://images.pexels.com/photos/{{ img }}/pexels-photo-{{ img }}.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=600&amp;h=740&amp;fit=crop" alt="Portrait of {{ name }}" width="600" height="740" loading="lazy">
    <p class="tpl-person-quote">{{ quote }}</p>
  </div>
  <h3>{{ name }}</h3>
  <p>{{ role }}</p>
</article>
