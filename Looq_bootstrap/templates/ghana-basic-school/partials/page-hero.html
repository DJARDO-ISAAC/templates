<section class="tpl-page-hero">
  <div class="tpl-hero-pattern" aria-hidden="true"></div>
  <div class="container position-relative">
    <nav aria-label="Breadcrumb">
      <ol class="breadcrumb tpl-breadcrumb tpl-anim-in">
        <li class="breadcrumb-item"><a href="./index.html">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">{{ crumb }}</li>
      </ol>
    </nav>
    <div class="row align-items-end gy-4">
      <div class="col-lg-7">
        <span class="tpl-eyebrow tpl-anim-in">{{ eyebrow }}</span>
        <h1 class="tpl-page-title tpl-anim-in tpl-d-1">{{ title }}</h1>
      </div>
      <div class="col-lg-5">
        <p class="tpl-lead mb-0 tpl-anim-in tpl-d-2">{{ lead }}</p>
      </div>
    </div>
  </div>
</section>
